name: Build and Release ZestTapPlugin

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Download ProtocolLib (Bypassing Maven)
      run: |
        mkdir -p libs
        wget -O libs/ProtocolLib.jar https://github.com/dmulloy2/ProtocolLib/releases/download/4.8.0/ProtocolLib.jar

    - name: Build with Maven
      run: mvn clean package -Dmaven.javadoc.skip=true -DskipTests

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ZestTapPlugin
        path: target/*.jar
        retention-days: 30